<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarajatlarim</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#2f6fed">
    
</head>
<style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background: #f5f6fa;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    form button {
      padding: 12px;
      font-size: 16px;
      background: #f01e1e;
      color: white;
      border: 0;
      border-radius: 8px;
    }
    h1 {
        text-align: center;
    }
        /* Jami summa */
#jami {
  font-size: 22px;
  font-weight: bold;
  margin: 20px 0 8px;
}

/* Ro'yxatning nuqtalarini olib tashlaymiz */
ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

/* Har bir yozuv: oq karta */
li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: white;
  padding: 12px 14px;
  margin-bottom: 8px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}
li:hover { background: #e8e9ed; }

/* O'chirish tugmasi */
li button {
  background: none;
  border: 0;
  color: #e5484d;
  font-size: 20px;
  cursor: pointer;
  padding: 8px 12px;
}
h3 {
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  color: #6b7280;
  margin: 20px 0 8px;
}
.zaxira {
  display: flex;
  gap: 8px;
  margin-top: 24px;
}
.zaxira button {
  flex: 1;
  padding: 10px;
  font-size: 14px;
  background: white;
  color: #1f2430;
  border: 1px solid #ccc;
  border-radius: 8px;
  cursor: pointer;
}

  </style>
<body>
    
  <h1>Xarajatlarim</h1>

  <form>
    <label for="nom">Nima uchun?</label>
    <input id="nom" placeholder="Masalan: non" required>
    <label for="miqdor">Miqdori:</label>
    <input type="number" id="miqdor" min="1" required>
    <label for="narx">Narxi:</label>
    <input type="number" id="narx" min="0" required>
    <label for="izoh">Izoh:</label>
    <input id="izoh" placeholder="Masalan: bozordan oldim">

    <button type="submit">Qo'shish</button>
  </form>
  <p id="jami"></p>
  <ul id="royxat"></ul>

  <div class="zaxira">
    <button type="button" id="eksportTugma">⬇ Zaxira nusxa</button>
    <button type="button" id="importTugma">⬆ Tiklash</button>
    <input type="file" id="fayl" accept=".json" hidden>
  </div>
  <script>
    // Daftar: saqlangan bo'lsa olib keladi, bo'lmasa bo'sh
    let yozuvlar = JSON.parse(localStorage.getItem("xarajatlar")) || [];
  
    // Sahifadagi forma va ro'yxatni topib olamiz
    const forma = document.querySelector("form");
    const royxat = document.getElementById("royxat");
  
    // "Qo'shish" bosilganda shu ishlar bajariladi
    forma.addEventListener("submit", function (e) {
      e.preventDefault(); // sahifa yangilanib ketmasin
  
      // 1. Maydonlardagi yozuvni o'qib, bitta yozuv qilamiz
      const yozuv = {
        nom: document.getElementById("nom").value,
        miqdor: Number(document.getElementById("miqdor").value),
        narx: Number(document.getElementById("narx").value),
        izoh: document.getElementById("izoh").value, // yangi
        sana: new Date().toLocaleDateString("sv-SE"),
     };
  
      yozuvlar.push(yozuv); // 2. Daftarga qo'shamiz
      saqla();              // 3. Brauzer xotirasiga saqlaymiz
      chiz();               // 4. Ekranda ko'rsatamiz
      forma.reset();        // 5. Maydonlarni tozalaymiz
    });
  
    // Daftarni brauzer xotirasiga saqlaydi
    function saqla() {
      localStorage.setItem("xarajatlar", JSON.stringify(yozuvlar));
    }
  
    // Daftardagi hamma yozuvni ekranga chiqaradi
    function chiz() {
  royxat.innerHTML = "";
  let jami = 0;

  // 1. Yozuvlarni kunlar bo'yicha qutilarga ajratamiz
  const kunlar = {};
  yozuvlar.forEach(function (y, i) {
    const kalit = y.sana || "0-eski"; // sanasi yo'q eski yozuvlar uchun
    if (!kunlar[kalit]) kunlar[kalit] = []; // quti yo'q bo'lsa, ochamiz
    kunlar[kalit].push({ y: y, i: i });     // i: o'chirish uchun raqamini ham eslab qolamiz
    jami = jami + y.miqdor * y.narx;
  });

  // 2. Sanalarni yangisidan eskisiga qarab chiqamiz
  Object.keys(kunlar).sort().reverse().forEach(function (kalit) {
    const guruh = kunlar[kalit];

    // Shu kunning jami
    let kunJami = 0;
    guruh.forEach(function (g) {
      kunJami = kunJami + g.y.miqdor * g.y.narx;
    });

    // Kun sarlavhasi
    const sarlavha = document.createElement("h3");
    const nomi = kalit === "0-eski" ? "Eski yozuvlar" : kalit;
    sarlavha.innerHTML = "<span>" + nomi + "</span><span>" + kunJami + " so'm</span>";
    royxat.appendChild(sarlavha);

    // Shu kunning yozuvlari
    guruh.forEach(function (g) {
      const y = g.y;
      const summa = y.miqdor * y.narx;

      const li = document.createElement("li");
      li.textContent = y.nom + ": " + y.miqdor + " × " + y.narx + " = " + summa + " so'm" +
        (y.izoh ? " (" + y.izoh + ")" : "") + " ";

      const tugma = document.createElement("button");
      tugma.textContent = "✕";
      tugma.onclick = function () {
        yozuvlar.splice(g.i, 1);
        saqla();
        chiz();
      };

      li.appendChild(tugma);
      royxat.appendChild(li);
    });
  });

  document.getElementById("jami").textContent = "Jami: " + jami + " so'm";
}
  // ZAXIRA NUSXA: yozuvlarni fayl qilib yuklab beradi
document.getElementById("eksportTugma").onclick = function () {
  const matn = JSON.stringify(yozuvlar, null, 2);
  const blob = new Blob([matn], { type: "application/json" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "xarajatlar-zaxira-" + new Date().toLocaleDateString("sv-SE") + ".json";
  a.click();
};

// TIKLASH: "Tiklash" tugmasi yashirin fayl maydonini bosadi
document.getElementById("importTugma").onclick = function () {
  document.getElementById("fayl").click();
};

// Fayl tanlanganda uni o'qiymiz
document.getElementById("fayl").onchange = function () {
  const fayl = this.files[0];
  if (!fayl) return;

  const oqigich = new FileReader();
  oqigich.onload = function () {
    try {
      const yangi = JSON.parse(oqigich.result);
      if (!Array.isArray(yangi)) throw new Error("noto'g'ri fayl");

      if (confirm(yangi.length + " ta yozuv tiklansinmi? Hozirgilari almashtiriladi.")) {
        yozuvlar = yangi;
        saqla();
        chiz();
      }
    } catch (xato) {
      alert("Fayl o'qilmadi. To'g'ri zaxira faylini tanlang.");
    }
  };
  oqigich.readAsText(fayl);
  this.value = ""; // bir faylni ketma-ket ikki marta tanlash mumkin bo'lishi uchun
};
    // Sahifa ochilishi bilan saqlangan yozuvlarni ko'rsatadi
    chiz();
    if ("serviceWorker" in navigator && location.hostname !== "127.0.0.1") {
  navigator.serviceWorker.register("./sw.js");
}
  </script>

</body>
</html>
